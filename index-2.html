<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="إدارة بيانات العملاء بسهولة"><title>سجلات العملاء</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--primary:#2563eb;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}body.dark{--bg:#0f172a;--card:#182235;--text:#f8fafc;--muted:#aab4c5;--line:#2c394d} .container{max-width:1100px;margin:auto;padding:22px}header{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap}h1{margin:0 0 5px;font-size:30px}header p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}button,input,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px 15px;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}.danger{background:var(--danger);color:#fff}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);outline:0}.top{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:18px}.count{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;white-space:nowrap}#status{min-height:24px;color:var(--muted);margin:10px 0}.error{color:var(--danger)!important}.success{color:#16a34a!important}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px}.card h3{margin:0 0 12px}.info{margin:8px 0;color:var(--muted);word-break:break-word}.info strong{color:var(--text)}.card a{color:var(--primary);text-decoration:none}.card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.empty{text-align:center;padding:45px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:16px}.pagination{display:flex;justify-content:center;gap:8px;margin:22px 0;flex-wrap:wrap}.pagination button.active{background:var(--primary);color:#fff}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.open{display:flex}.dialog{width:min(520px,100%);background:var(--card);border-radius:18px;padding:20px}.dialog h2{margin-top:0}label{display:block;margin:12px 0 6px;font-weight:700}input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);outline:0}textarea{min-height:90px;resize:vertical}.form-actions{display:flex;gap:8px;margin-top:17px}@media(max-width:650px){.container{padding:14px}h1{font-size:25px}.top{grid-template-columns:1fr}.count{text-align:center}.grid{grid-template-columns:1fr}}
</style></head><body><div class="container"><header><div><h1>سجلات العملاء</h1><p>إدارة بيانات العملاء بسهولة</p></div><div class="actions"><button class="secondary" id="langBtn">English</button><button class="secondary" id="themeBtn">🌙 الوضع الليلي</button><button class="primary" id="addBtn">＋ إضافة عميل</button></div></header><div class="top"><input class="search" id="search" placeholder="ابحث بالاسم أو رقم الهاتف..."><div class="count"><span id="countLabel">عدد العملاء:</span> <strong id="count">0</strong></div></div><div id="status">جاري تحميل العملاء...</div><div id="list" class="grid"></div><div id="pagination" class="pagination"></div></div><div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">إضافة عميل</h2><form id="form"><label id="nameLabel">الاسم *</label><input id="name" required maxlength="120"><label id="phoneLabel">رقم الهاتف *</label><input id="phone" required maxlength="40" inputmode="tel"><label id="locationLabel">الموقع</label><input id="location" maxlength="500" placeholder="رابط Google Maps أو اكتب العنوان هنا"><label id="notesLabel">ملاحظات</label><textarea id="notes" maxlength="1000"></textarea><div class="form-actions"><button class="primary" type="submit" id="saveBtn">حفظ</button><button class="secondary" type="button" id="cancelBtn">إلغاء</button></div></form></div></div><script>
const API="https://wbtblvjwtuzmhfngnosu.supabase.co/functions/v1/customer-records",state={customers:[],page:1,perPage:10,editing:null,lang:localStorage.getItem("lang")||"ar"},$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c])),T={ar:{title:"سجلات العملاء",sub:"إدارة بيانات العملاء بسهولة",add:"＋ إضافة عميل",search:"ابحث بالاسم أو رقم الهاتف...",count:"عدد العملاء:",loading:"جاري تحميل العملاء...",loaded:"تم تحميل سجلات العملاء",loaderr:"تعذر تحميل العملاء: ",server:"حدث خطأ في الاتصال بالخادم.",name:"الاسم *",phone:"رقم الهاتف *",loc:"الموقع",locph:"رابط Google Maps أو اكتب العنوان هنا",notes:"ملاحظات",save:"حفظ",cancel:"إلغاء",edit:"تعديل",del:"حذف",addtitle:"إضافة عميل",edittitle:"تعديل عميل",map:"فتح الموقع على الخريطة",empty:"لا توجد نتائج.",saving:"جاري الحفظ...",saved:"تم حفظ بيانات العميل",saveerr:"تعذر الحفظ: ",deleting:"جاري الحذف...",deleted:"تم حذف العميل",delerr:"تعذر الحذف: ",confirm:"هل تريد حذف العميل",day:"☀️ الوضع النهاري",night:"🌙 الوضع الليلي"},en:{title:"Customer Records",sub:"Manage customer data easily",add:"＋ Add customer",search:"Search by name or phone...",count:"Customers:",loading:"Loading customers...",loaded:"Customer records loaded",loaderr:"Unable to load customers: ",server:"Server connection error.",name:"Name *",phone:"Phone number *",loc:"Location",locph:"Google Maps link or enter an address",notes:"Notes",save:"Save",cancel:"Cancel",edit:"Edit",del:"Delete",addtitle:"Add customer",edittitle:"Edit customer",map:"Open location in Google Maps",empty:"No results.",saving:"Saving...",saved:"Customer data saved",saveerr:"Unable to save: ",deleting:"Deleting...",deleted:"Customer deleted",delerr:"Unable to delete: ",confirm:"Do you want to delete customer",day:"☀️ Light mode",night:"🌙 Dark mode"}};
function tr(k){return T[state.lang][k]||k}function status(m,c=""){ $("status").textContent=m;$("status").className=c }async function api(p="",o={}){let r=await fetch(API+p,{...o,headers:{"Content-Type":"application/json",...(o.headers||{})}}),d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error(d?.error||d?.message||`HTTP ${r.status}`);return d}function filtered(){let q=$("search").value.trim().toLowerCase();return state.customers.filter(c=>!q||String(c.name||"").toLowerCase().includes(q)||String(c.phone||"").toLowerCase().includes(q))}function maps(v){return /^https?:\/\/(maps\.app\.goo\.gl|(?:www\.)?google\.[^/]+\/maps|maps\.google\.)/i.test(v)}function loc(v){if(!v)return"";return maps(v)?`<div class="info">📍 <a href="${esc(v)}" target="_blank" rel="noopener">${tr("map")}</a></div>`:`<div class="info">📍 ${esc(v)}</div>`}
function render(){let rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/state.perPage));if(state.page>pages)state.page=pages;let a=rows.slice((state.page-1)*state.perPage,state.page*state.perPage);$("count").textContent=state.customers.length;$("list").innerHTML=a.length?a.map(c=>`<article class="card"><h3>${esc(c.name)}</h3><div class="info">📞 <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></div>${loc(c.location)}${c.notes?`<div class="info">📝 <strong>${tr("notes")}:</strong> ${esc(c.notes)}</div>`:""}<div class="card-actions"><button class="secondary" onclick="editCustomer('${esc(c.id)}')">${tr("edit")}</button><button class="danger" onclick="deleteCustomer('${esc(c.id)}')">${tr("del")}</button></div></article>`).join(""):`<div class="empty" style="grid-column:1/-1">${tr("empty")}</div>`;$("pagination").innerHTML=Array.from({length:pages},(_,i)=>`<button class="${i+1===state.page?"active ":""}secondary" onclick="goPage(${i+1})">${i+1}</button>`).join("")}function goPage(n){state.page=n;render();scrollTo({top:0,behavior:"smooth"})}
async function load(){try{status(tr("loading"));let d=await api();state.customers=Array.isArray(d)?d:(d?.customers||[]);render();status(tr("loaded"),"success")}catch(e){status(tr("loaderr")+e.message,"error");$("list").innerHTML=`<div class="empty" style="grid-column:1/-1">${tr("server")}</div>`}}function openModal(c=null){state.editing=c?.id||null;$("modalTitle").textContent=c?tr("edittitle"):tr("addtitle");$("name").value=c?.name||"";$("phone").value=c?.phone||"";$("location").value=c?.location||"";$("notes").value=c?.notes||"";$("modal").classList.add("open");setTimeout(()=>$("name").focus(),50)}function closeModal(){state.editing=null;$("modal").classList.remove("open")}function editCustomer(id){let c=state.customers.find(x=>String(x.id)===String(id));if(c)openModal(c)}async function deleteCustomer(id){let c=state.customers.find(x=>String(x.id)===String(id));if(!c||!confirm(tr("confirm")+` "${c.name}"?`))return;try{status(tr("deleting"));await api("/"+encodeURIComponent(id),{method:"DELETE"});state.customers=state.customers.filter(x=>String(x.id)!==String(id));render();status(tr("deleted"),"success")}catch(e){status(tr("delerr")+e.message,"error")}}
$("form").addEventListener("submit",async e=>{e.preventDefault();let p={name:$("name").value.trim(),phone:$("phone").value.trim(),location:$("location").value.trim()||null,notes:$("notes").value.trim()||null};if(!p.name||!p.phone)return;try{status(tr("saving"));if(state.editing){let id=state.editing,d=await api("/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify(p)}),item=d?.customer||d,i=state.customers.findIndex(x=>String(x.id)===String(id));if(i>=0)state.customers[i]=item}else{let d=await api("",{method:"POST",body:JSON.stringify(p)});state.customers.unshift(d?.customer||d)}closeModal();render();status(tr("saved"),"success")}catch(e){status(tr("saveerr")+e.message,"error")}});
function applyLang(){document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==="ar"?"rtl":"ltr";document.title=tr("title");document.querySelector("h1").textContent=tr("title");document.querySelector("header p").textContent=tr("sub");$("addBtn").textContent=tr("add");$("search").placeholder=tr("search");$("countLabel").textContent=tr("count");$("nameLabel").textContent=tr("name");$("phoneLabel").textContent=tr("phone");$("locationLabel").textContent=tr("loc");$("location").placeholder=tr("locph");$("notesLabel").textContent=tr("notes");$("saveBtn").textContent=tr("save");$("cancelBtn").textContent=tr("cancel");$("langBtn").textContent=state.lang==="ar"?"English":"العربية";$("themeBtn").textContent=document.body.classList.contains("dark")?tr("day"):tr("night");$("modalTitle").textContent=state.editing?tr("edittitle"):tr("addtitle");render()}
$("addBtn").onclick=()=>openModal();$("cancelBtn").onclick=closeModal;$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()};$("search").oninput=()=>{state.page=1;render()};$("langBtn").onclick=()=>{state.lang=state.lang==="ar"?"en":"ar";localStorage.setItem("lang",state.lang);applyLang()};$("themeBtn").onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("dark",document.body.classList.contains("dark"));applyLang()};if(localStorage.getItem("dark")==="true")document.body.classList.add("dark");applyLang();load();</script></body></html>
